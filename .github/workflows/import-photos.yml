# One-off helper: unpacks an uploaded archive in import/ (photos, brand guidelines)
# into the repository and pulls the Ruhaama photo from the old WordPress site.
# Safe to delete after use.
name: Import photos (one-off)

on:
  push:
    branches: [main]
    paths: ['import/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack uploaded archives
        run: |
          shopt -s nullglob
          for z in import/*.zip; do
            unzip -o -q "$z" -x '.github/*' '__MACOSX/*'
            git rm -q "$z"
          done
      - name: 'Remove listed files (import/delete.txt, one path per line)'
        run: |
          if [ -f import/delete.txt ]; then
            grep -v '^#' import/delete.txt | sed '/^$/d' | while IFS= read -r f; do git rm -q --ignore-unmatch -- "$f"; done
            rm -f import/delete.txt
          fi
      - name: 'Download listed files (import/fetch.txt, one line per file - target path and URL)'
        run: |
          if [ -f import/fetch.txt ]; then
            while read -r target url; do
              case "$target" in ''|'#'*) continue;; esac
              mkdir -p "$(dirname "$target")"
              curl -fsSL -A 'BantuEV-Website-Import/1.0 (+https://www.bantu-ev.org)' -o "$target" "$url" && echo "ok: $target" || echo "FAILED: $url"
            done < import/fetch.txt
            rm -f import/fetch.txt
          fi
      - name: Fetch Ruhaama photo from the old website
        run: |
          sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y webp >/dev/null
          mkdir -p public/images/projects
          if curl -fsSL -o /tmp/ruhaama.jpg "https://www.bantu-ev.org/wp-content/uploads/2023/10/IMG_7232-scaled.jpeg"; then
            cwebp -quiet -q 74 -resize 1280 0 /tmp/ruhaama.jpg -o public/images/projects/ruhaama-community-resource-centre.webp
          else
            echo "Old site not reachable - skipped"
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git diff --cached --quiet && exit 0
          git commit -m "Import photos, donation form, homepage slideshow and live-server deploy (uploaded archive)"
          git push
      - name: Trigger build and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
