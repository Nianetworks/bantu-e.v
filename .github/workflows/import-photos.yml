# Helper for binary updates: unpacks ONE uploaded archive in import/ (photos, logos, PDFs, text files)
# into the repository, removes files listed in import/delete.txt and downloads files listed in
# import/fetch.txt ("<target path> <url> [width]"; .webp targets are converted, optionally resized).
name: Import uploaded archive

on:
  push:
    branches: [main]
    paths: ['import/**']
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install image tools
        run: sudo apt-get -qq update >/dev/null && sudo apt-get -qq install -y webp >/dev/null
      - name: Unpack uploaded archives
        run: |
          shopt -s nullglob
          for z in import/*.zip; do
            unzip -o -q "$z" -x '.github/*' '__MACOSX/*'
            git rm -q "$z"
          done
      - name: 'Remove listed files (import/delete.txt, one path per line)'
        run: |
          if [ -f import/delete.txt ]; then
            grep -v '^#' import/delete.txt | sed '/^$/d' | while IFS= read -r f; do git rm -q --ignore-unmatch -- "$f"; done
            rm -f import/delete.txt
          fi
      - name: 'Download listed files (import/fetch.txt: target path, URL, optional width)'
        run: |
          if [ -f import/fetch.txt ]; then
            while read -r target url width; do
              case "$target" in ''|'#'*) continue;; esac
              mkdir -p "$(dirname "$target")"
              tmp="$(mktemp)"
              if curl -fsSL -A 'BantuEV-Website-Import/1.0 (+https://www.bantu-ev.org)' -o "$tmp" "$url"; then
                case "$target" in
                  *.webp)
                    if [ -n "$width" ] && [ "$width" != "0" ]; then cwebp -quiet -q 90 -alpha_q 100 -resize "$width" 0 "$tmp" -o "$target"; else cwebp -quiet -q 90 -alpha_q 100 "$tmp" -o "$target"; fi ;;
                  *) cp "$tmp" "$target" ;;
                esac
                echo "ok: $target"
              else
                echo "FAILED: $url"
              fi
              rm -f "$tmp"
            done < import/fetch.txt
            rm -f import/fetch.txt
          fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A -- . ':!.github'
          git diff --cached --quiet && exit 0
          git commit -m "Import uploaded archive (site update)"
          git push
      - name: Trigger build and deploy
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
