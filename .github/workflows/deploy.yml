name: Build and deploy (live server + GitHub Pages preview)

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Nightly rebuild so "upcoming events" and the announcement bar stay current
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Repository variable CUSTOM_DOMAIN (e.g. www.bantu-ev.org) switches from the
          # github.io preview (sub-path) to the live domain (root path).
          SITE_URL: ${{ vars.CUSTOM_DOMAIN && format('https://{0}', vars.CUSTOM_DOMAIN) || format('https://{0}.github.io', github.repository_owner) }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN && '/' || format('/{0}', github.event.repository.name) }}
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  live:
    # Production build for https://www.bantu-ev.org (Bantu e.V. hosting, cPanel account "bantuev").
    # The build (incl. .htaccess) is pushed to branch `live`; the server pulls that branch
    # every 10 minutes via the cron job ~/bin/bantu-site-deploy.sh (see docs/02).
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build for www.bantu-ev.org
        env:
          SITE_URL: https://www.bantu-ev.org
          BASE_PATH: /
          HTACCESS: '1'
        run: npm run build
      - name: Publish dist/ to branch live
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd dist
          git init -q -b live
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Live build of ${GITHUB_SHA::7} ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" live
