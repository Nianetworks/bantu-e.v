# One-off helper: unpacks the uploaded source archive into the repository and removes the archive.
# Safe to delete after the first successful run.
name: Unpack uploaded source (one-off)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive and commit
        run: |
          set -e
          ARCHIVE=$(ls *.tar.gz 2>/dev/null | head -1 || true)
          if [ -z "$ARCHIVE" ]; then echo "No archive found – nothing to do."; exit 0; fi
          tar -xzf "$ARCHIVE" --strip-components=1 --exclude='*/.github' --exclude='*/.github/*'
          git rm -q "$ARCHIVE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Website-Quellcode aus Archiv entpackt"
          git push
